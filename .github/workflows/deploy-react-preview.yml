name: Deploy React-Preview

on:
  push:
    branches: [react-migration]

permissions:
  contents: write

jobs:
  build-and-deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: React-App auschecken
        uses: actions/checkout@v4
        with:
          path: react-app

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Abhängigkeiten installieren und bauen
        working-directory: react-app
        run: |
          npm ci
          npm run build

      - name: main-Branch auschecken
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-branch

      - name: Build in preview-react/-Unterordner von main kopieren
        run: |
          rm -rf main-branch/preview-react
          mkdir -p main-branch/preview-react
          cp -r react-app/dist/* main-branch/preview-react/

      - name: Änderungen committen und pushen
        working-directory: main-branch
        run: |
          git config user.name "react-preview-bot"
          git config user.email "actions@github.com"
          git add preview-react
          git diff --staged --quiet && echo "keine Änderung" || git commit -m "[skip ci] React-Vorschau aktualisiert (aus react-migration)"
          git push

      - name: Kurz warten, bis GitHub Pages die Vorschau ausliefert
        run: sleep 60

      - name: Playwright installieren
        working-directory: main-branch
        run: |
          npm init -y
          npm install playwright@1.48.0
          npx playwright install --with-deps chromium

      - name: E2E-Test gegen die React-Vorschau ausführen
        working-directory: main-branch
        run: node test/e2e.js
        env:
          APP_URL: https://codingwatzz.github.io/timesync/preview-react/
          RESULT_FILE: last-result-react-preview.json

      - name: React-Vorschau-Testergebnis committen
        if: always()
        working-directory: main-branch
        run: |
          git add test/last-result-react-preview.json
          git diff --staged --quiet && echo "keine Änderung" || git commit -m "[skip ci] React-Vorschau E2E-Testergebnis"
          git push
