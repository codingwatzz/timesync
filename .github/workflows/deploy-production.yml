name: Build and Deploy (Production)

# Engineering-Review 07.09.2026, Punkt 3: nutzt jetzt die offizielle GitHub-Pages-Actions-
# Bereitstellung (actions/upload-pages-artifact + actions/deploy-pages) statt den Build in den
# main-Branch-Root zu committen. Vorher musste jede neue Root-Datei/jedes neue Root-Verzeichnis
# manuell in eine Ausnahmeliste eingetragen werden (sonst beim naechsten Deploy geloescht - genau
# das ist am 01.09. und 02.09.2026 real passiert, siehe CLAUDE_CHECKLIST.md). Diese Ausnahmeliste
# UND das Risiko fallen mit dem Wechsel komplett weg, main enthaelt jetzt nur noch Quellcode.
# Voraussetzung (einmalig, manuell): Repo-Settings -> Pages -> Source auf "GitHub Actions"
# umgestellt.

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/deploy-production.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # nur fuer den CI-Log-Commit bei einem Fehlschlag unten noetig
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Abhängigkeiten installieren
        working-directory: app
        run: npm ci

      - name: Unit-Tests ausführen
        id: unit_tests
        working-directory: app
        continue-on-error: true
        run: npx vitest run --config vitest.config.ts 2>&1 | tee /tmp/test-output.log

      - name: Lint ausführen
        id: lint
        working-directory: app
        continue-on-error: true
        run: npm run lint 2>&1 | tee /tmp/lint-output.log

      - name: Bauen
        id: build
        working-directory: app
        continue-on-error: true
        run: npm run build 2>&1 | tee /tmp/build-output.log

      - name: Service-Worker-Version stempeln
        if: steps.build.outcome == 'success'
        run: sed -i "s/const CACHE_NAME = 'zeiterfassung-__BUILD_ID__'/const CACHE_NAME = 'zeiterfassung-${{ github.sha }}'/" app/dist/service-worker.js

      # Schreibt bei einem Fehlschlag die vollstaendige Ausgabe als Datei zurueck ins Repo.
      # Grund: Ich (Claude) kann GitHubs Log-/Artefakt-Download nicht direkt erreichen
      # (Netzwerksperre meiner Sandbox), aber Dateien im Repo ganz normal per API lesen.
      # Damit brauche ich fuer die Fehlersuche keine Screenshots mehr von dir.
      - name: CI-Log bei Fehlschlag ins Repo committen
        if: steps.unit_tests.outcome == 'failure' || steps.lint.outcome == 'failure' || steps.build.outcome == 'failure'
        run: |
          mkdir -p ci-logs
          {
            echo "Zeitpunkt: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Commit: ${{ github.sha }}"
            echo ""
            echo "=== Unit-Tests (${{ steps.unit_tests.outcome }}) ==="
            cat /tmp/test-output.log 2>/dev/null || echo "(kein Log)"
            echo ""
            echo "=== Lint (${{ steps.lint.outcome }}) ==="
            cat /tmp/lint-output.log 2>/dev/null || echo "(kein Log)"
            echo ""
            echo "=== Build (${{ steps.build.outcome }}) ==="
            cat /tmp/build-output.log 2>/dev/null || echo "(kein Log)"
          } > ci-logs/last-deploy-error.txt
          git config user.name "ci-log-bot"
          git config user.email "actions@github.com"
          git add ci-logs/last-deploy-error.txt
          git diff --staged --quiet && exit 0
          git commit -m "[skip ci] CI-Fehler-Log aktualisiert"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase -X ours origin/main && break
            git rebase --abort || true
            sleep $((RANDOM % 5 + 2))
          done
          git push

      - name: Bei Fehlschlag abbrechen (nach dem Log-Commit)
        if: steps.unit_tests.outcome == 'failure' || steps.lint.outcome == 'failure' || steps.build.outcome == 'failure'
        run: exit 1

      - name: Pages vorbereiten
        uses: actions/configure-pages@v5

      - name: Build-Ordner als Pages-Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Nach GitHub Pages deployen
        id: deployment
        uses: actions/deploy-pages@v4
