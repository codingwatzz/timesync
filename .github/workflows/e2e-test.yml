name: E2E Test (Live App)

on:
  push:
    branches: [main]
    paths-ignore: ['test/last-result.json']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Playwright installieren
        run: |
          npm init -y
          npm install playwright@1.48.0
          npx playwright install --with-deps chromium

      - name: E2E-Test ausführen
        run: node test/e2e.js

      - name: Screenshots als Artefakt hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: test/screenshots/
          retention-days: 14

      - name: Testergebnis zurück ins Repo committen
        if: always()
        run: |
          git config user.name "e2e-bot"
          git config user.email "actions@github.com"
          git add test/last-result.json
          git diff --staged --quiet && echo "keine Änderung" || git commit -m "[skip ci] E2E-Testergebnis: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
