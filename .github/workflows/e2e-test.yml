name: E2E Test (Live App)

on:
  # GEÄNDERT (02.09.2026): läuft NICHT mehr automatisch nach jedem Deploy. Grund: Playwright-
  # Installation + kompletter Klick-Durchlauf (zwei parallele Jobs: test + offline-test) kostet
  # mehrere Minuten GitHub-Actions-Zeit UND mehrere Minuten Warten pro Chat-Sitzung - bei jedem
  # einzelnen Push unverhältnismäßig teuer. npm run verify (Unit-Tests+Lint+Build, lokal,
  # Sekunden, kostenlos) ist die verbindliche Pflichtprüfung vor jedem Push (siehe
  # CLAUDE_CHECKLIST.md) und fängt die allermeisten Fehler schon ab. E2E läuft jetzt nur noch:
  workflow_dispatch: {}
  schedule:
    # Läuft täglich um 06:00 UTC, unabhängig von Code-Änderungen - fängt "stille"
    # Verschlechterung ab (z.B. Appwrite-API-Änderung, CDN-Ausfall, abgelaufenes Zertifikat),
    # die sonst erst beim nächsten Push oder bei manueller Nutzung auffallen würde.
    - cron: '0 6 * * *'
  # workflow_run (bei jedem Deploy) bewusst entfernt - bei Bedarf manuell über "Run workflow"
  # in der GitHub-Actions-UI auslösen, oder Claude explizit fragen, es zu tun (z.B. vor einer
  # riskanten Storage-/Persistenz-Änderung).

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Playwright installieren
        run: |
          npm init -y
          npm install playwright@1.48.0
          npx playwright install --with-deps chromium

      - name: E2E-Test ausführen
        env:
          APPWRITE_EMAIL: ${{ secrets.APPWRITE_EMAIL }}
          APPWRITE_PASSWORD: ${{ secrets.APPWRITE_PASSWORD }}
        run: node test/e2e.js

      - name: Screenshots als Artefakt hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: test/screenshots/
          retention-days: 14

      - name: Testergebnis zurück ins Repo committen
        if: always()
        continue-on-error: true
        run: |
          git config user.name "e2e-bot"
          git config user.email "actions@github.com"
          git add test/last-result.json
          git diff --staged --quiet && echo "keine Änderung" && exit 0
          git commit -m "[skip ci] E2E-Testergebnis: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3 4 5; do
            git fetch origin main
            # -X ours: bei Konflikten gewinnt IMMER unsere frisch erzeugte Ergebnisdatei -
            # verhindert Rebase-Konflikte, wenn mehrere Läufe kurz hintereinander schreiben.
            git rebase -X ours origin/main && break
            git rebase --abort || true
            sleep $((RANDOM % 5 + 2))
          done
          git push

  offline-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Playwright installieren
        run: |
          npm init -y
          npm install playwright@1.48.0
          npx playwright install --with-deps chromium

      - name: Offline-/PWA-Test ausführen
        env:
          APPWRITE_EMAIL: ${{ secrets.APPWRITE_EMAIL }}
          APPWRITE_PASSWORD: ${{ secrets.APPWRITE_PASSWORD }}
        run: node test/offline-test.js

      - name: Offline-Screenshots als Artefakt hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-screenshots
          path: test/screenshots-offline/
          retention-days: 14

      - name: Offline-Testergebnis zurück ins Repo committen
        if: always()
        continue-on-error: true
        run: |
          git config user.name "offline-test-bot"
          git config user.email "actions@github.com"
          git add test/last-result-offline.json
          git diff --staged --quiet && echo "keine Änderung" && exit 0
          git commit -m "[skip ci] Offline-Testergebnis: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase -X ours origin/main && break
            git rebase --abort || true
            sleep $((RANDOM % 5 + 2))
          done
          git push
