name: E2E Test (Live App)

on:
  # WICHTIG: reagiert bewusst NICHT direkt auf "push", sondern erst NACHDEM das
  # Deploy-Workflow vollständig abgeschlossen ist (inkl. dessen eigenem Commit des
  # gebauten Outputs). Grund: Der Deploy-Workflow committet am Ende seinen Build
  # zurück ins Repo - das würde bei "push" als Trigger einen ZWEITEN, parallel
  # laufenden E2E-Testlauf auslösen, der sich mit dem ursprünglichen Lauf um dieselben
  # Test-Tage in der gemeinsamen Appwrite-Datenbank in die Quere kommt (beobachtet am
  # 31.08.2026: Felder wurden scheinbar grundlos leer gelesen).
  workflow_run:
    workflows: ['Build and Deploy (Production)']
    types: [completed]
  workflow_dispatch: {}
  schedule:
    # Läuft täglich um 06:00 UTC, unabhängig von Code-Änderungen - fängt "stille"
    # Verschlechterung ab (z.B. Appwrite-API-Änderung, CDN-Ausfall, abgelaufenes Zertifikat),
    # die sonst erst beim nächsten Push oder bei manueller Nutzung auffallen würde.
    - cron: '0 6 * * *'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    # Bei workflow_run nur weiterlaufen, wenn das Deploy-Workflow auch wirklich erfolgreich war
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Playwright installieren
        run: |
          npm init -y
          npm install playwright@1.48.0
          npx playwright install --with-deps chromium

      - name: E2E-Test ausführen
        run: node test/e2e.js

      - name: Screenshots als Artefakt hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: test/screenshots/
          retention-days: 14

      - name: Testergebnis zurück ins Repo committen
        if: always()
        continue-on-error: true
        run: |
          git config user.name "e2e-bot"
          git config user.email "actions@github.com"
          git add test/last-result.json
          git diff --staged --quiet && echo "keine Änderung" && exit 0
          git commit -m "[skip ci] E2E-Testergebnis: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3 4 5; do
            git fetch origin main
            # -X ours: bei Konflikten gewinnt IMMER unsere frisch erzeugte Ergebnisdatei -
            # verhindert Rebase-Konflikte, wenn mehrere Läufe kurz hintereinander schreiben.
            git rebase -X ours origin/main && break
            git rebase --abort || true
            sleep $((RANDOM % 5 + 2))
          done
          git push

  offline-test:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Playwright installieren
        run: |
          npm init -y
          npm install playwright@1.48.0
          npx playwright install --with-deps chromium

      - name: Offline-/PWA-Test ausführen
        run: node test/offline-test.js

      - name: Offline-Screenshots als Artefakt hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-screenshots
          path: test/screenshots-offline/
          retention-days: 14

      - name: Offline-Testergebnis zurück ins Repo committen
        if: always()
        continue-on-error: true
        run: |
          git config user.name "offline-test-bot"
          git config user.email "actions@github.com"
          git add test/last-result-offline.json
          git diff --staged --quiet && echo "keine Änderung" && exit 0
          git commit -m "[skip ci] Offline-Testergebnis: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase -X ours origin/main && break
            git rebase --abort || true
            sleep $((RANDOM % 5 + 2))
          done
          git push
