<style>
  :root {
    --ink: #1c2521;

    --teal: #1f5f5b;
    --teal-dark: #123f3c;
    --amber: #c9793a;

    --red: #b0483f;
    --grey: #8b8a7f;
    --tab-a: #1f5f5b;
    --tab-w: #b7b2a2;
    --tab-f: #c9793a;
    --tab-u: #5b7a9e;
    --tab-k: #b0483f;
    --tab-g: #9b8b5f;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; padding:0; background:var(--paper); color:var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; }
  .mono { font-family: "SF Mono", "IBM Plex Mono", Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
  #app { max-width: 480px; margin: 0 auto; min-height: 100vh; display:flex; flex-direction:column; padding-bottom: 24px; }

  /* Desktop: App als zentrierte Karte statt schmalem Streifen im Browserfenster */
  @media (min-width: 640px) {
    html, body { background: var(--teal-dark); }
    #app { min-height: calc(100vh - 48px); margin: 24px auto; background: var(--paper);
      border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.35); overflow: hidden; }
    header.top { border-radius: 20px 20px 0 0; }
    .day-row:hover { background:#f1efe6; }
    .typ-pick button:hover, .yesno button:hover, .add-receipt-row button:hover { border-color: var(--teal); }
    .sheet-actions .close:hover { background:#f1efe6; }
    .sheet-actions .save:hover, .fab button:hover, .export-download:hover { background: var(--teal-dark); }
  }

  header.top { position: sticky; top:0; z-index: 20; background: var(--paper); padding: 18px 18px 8px; border-bottom: 1px solid var(--line); }
  .brand { display:flex; align-items:baseline; justify-content:space-between; }
  .brand h1 { font-size: 19px; margin:0; letter-spacing: 0.01em; font-weight: 700; }
  .brand .tag { font-size: 11px; color: var(--grey); text-transform: uppercase; letter-spacing: 0.08em; }

  .month-nav { display:flex; align-items:center; justify-content:space-between; margin-top: 14px; }
  .month-nav button { background:none; border:none; font-size: 20px; color: var(--teal); padding: 4px 10px; cursor:pointer; }
  .month-nav .label { font-size: 16px; font-weight:700; }

  .summary-strip { display:flex; gap:8px; margin-top:12px; }
  .summary-strip .pill { flex:1; background: var(--card); border:1px solid var(--line); border-radius:10px; padding:8px 10px; }
  .summary-strip .pill .n { font-size:15px; font-weight:700; font-family:"SF Mono",monospace; }
  .summary-strip .pill .l { font-size:10px; color:var(--grey); text-transform:uppercase; letter-spacing:0.05em; }

  .typ-pick button.active.F { background:var(--tab-f); } .typ-pick button.active.U { background:var(--tab-u); }

  .sheet-actions { display:flex; gap:10px; margin-top: 22px; }
  .sheet-actions button { flex:1; border:none; border-radius:10px; padding:13px; font-size:14px; font-weight:700; cursor:pointer; }
  .sheet-actions .save { background: var(--teal); color:white; }
  .sheet-actions .close { background: var(--card); border:1px solid var(--line); color:var(--ink); }

  .export-view { padding: 4px 18px 40px; }
  .export-view h2 { font-size:18px; }
  .export-table { width:100%; border-collapse:collapse; font-size:12px; margin-top:12px; }
  .export-table th { text-align:left; color:var(--grey); font-weight:600; text-transform:uppercase; font-size:9px; padding:6px 6px; border-bottom:1px solid var(--line); }
  .export-table td { padding:7px 6px; border-bottom:1px solid var(--line); font-family:"SF Mono",monospace; }
  .export-note { background: var(--amber-soft); color:#7a4a1f; padding:10px 12px; border-radius:9px; font-size:12px; margin-top:14px; line-height:1.5; }
  .export-download { display:block; width:100%; background: var(--teal); color:white; text-align:center; border:none; border-radius:10px; padding:14px; font-size:15px; font-weight:700; margin-top:18px; cursor:pointer; }
  .back-link { background:none; border:none; color:var(--teal); font-size:14px; font-weight:600; padding:4px 0; margin-bottom:6px; cursor:pointer; }

  .toast { position:fixed; bottom:90px; left:50%; transform:translateX(-50%); background:var(--ink); color:white; padding:10px 18px; border-radius:20px; font-size:13px; z-index:80; opacity:0; transition:opacity 0.2s; pointer-events:none; }
  .toast.show { opacity:1; }

  .empty-state { text-align:center; padding: 40px 20px; color:var(--grey); }
  .empty-state .big { font-size:34px; margin-bottom:8px; }

  #debugBtn { position:fixed; bottom:14px; right:14px; z-index:90; width:34px; height:34px; border-radius:50%;
    background: var(--card); border:1px solid var(--line); color:var(--grey); font-size:15px; cursor:pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
  #debugOverlay { display:none; position:fixed; inset:0; z-index:200; background:rgba(20,24,20,0.55); align-items:center; justify-content:center; }
  #debugOverlay.show { display:flex; }
  #debugPanel { background: var(--paper); width:min(92vw,480px); max-height:78vh; border-radius:14px; padding:16px;
    display:flex; flex-direction:column; box-shadow:0 20px 50px rgba(0,0,0,0.35); }
  #debugPanel .debug-header { font-weight:700; font-size:14px; margin-bottom:8px; color:var(--teal-dark); }
  #debugContent { flex:1; overflow-y:auto; background:var(--card); border:1px solid var(--line); border-radius:9px;
    padding:10px; font-family:"SF Mono",Menlo,Consolas,monospace; font-size:11px; white-space:pre-wrap; word-break:break-word; margin:0 0 10px; }
  #debugCloseBtn { align-self:flex-end; background:var(--teal); color:white; border:none; border-radius:8px; padding:8px 16px; font-size:13px; font-weight:600; cursor:pointer; }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>
<button id="debugBtn" title="Diagnose anzeigen">🛈</button>
<div id="debugOverlay">
  <div id="debugPanel">
    <div class="debug-header">Diagnose</div>
    <pre id="debugContent"></pre>
    <button id="debugCloseBtn">Schließen</button>
  </div>
</div>

<script>
const { jsPDF } = window.jspdf;

// ---------- Diagnose-Log (sichtbar über den 🛈-Button, ersetzt Browser-Konsole für einfaches Debugging) ----------
const DEBUG_LOG = [];
let storageMode = 'wird ermittelt…';
function logDebug(msg){
  const line = '[' + new Date().toLocaleTimeString('de-DE') + '] ' + msg;
  DEBUG_LOG.push(line);
  if (DEBUG_LOG.length > 60) DEBUG_LOG.shift();
  renderDebugPanel();
}
function renderDebugPanel(){
  const content = document.getElementById('debugContent');
  if (!content) return;
  content.textContent = 'Speicher-Modus: ' + storageMode + '\n' +
    'URL: ' + location.href + '\n' +
    'User-Agent: ' + navigator.userAgent + '\n\n' +
    (DEBUG_LOG.length ? DEBUG_LOG.join('\n') : '(noch keine Log-Einträge)');
}
document.getElementById('debugBtn').addEventListener('click', ()=>{
  renderDebugPanel();
  document.getElementById('debugOverlay').classList.add('show');
});
document.getElementById('debugCloseBtn').addEventListener('click', ()=>{
  document.getElementById('debugOverlay').classList.remove('show');
});

// ---------- Konstanten ----------
const WOCHENTAGE = ['So','Mo','Di','Mi','Do','Fr','Sa'];
const TYP_LABEL = { A:'Arbeit', W:'Wochenende', F:'Feiertag', U:'Urlaub', K:'Krank', G:'Gleitfrei' };
const REISEARTEN = ['', 'Anreisetag', 'Abreisetag', 'Abwesenheitstag (>8h)', 'Abwesenheitstag (24h)'];
const LAENDER = ['Deutschland', 'Österreich', 'Schweiz'];

function pad(n){ return String(n).padStart(2,'0'); }
function dateKey(y,m,d){ return `${y}-${pad(m)}-${pad(d)}`; }
function daysInMonth(y,m){ return new Date(y, m, 0).getDate(); }
function todayKey(){ const t=new Date(); return dateKey(t.getFullYear(), t.getMonth()+1, t.getDate()); }
function fmtEUR(n){ return (Math.round((n||0)*100)/100).toFixed(2).replace('.', ','); }
// Gesetzliche Feiertage Rheinland-Pfalz: 9 bundesweite + Fronleichnam + Allerheiligen.
// Wird für jedes Jahr automatisch berechnet (inkl. beweglicher Feiertage, die vom
// Ostersonntag abhängen) - funktioniert für 2026 und alle Folgejahre ohne manuelle Pflege.

// Ostersonntag nach der Gaußschen Osterformel (gregorianischer Kalender).
function ostersonntag(jahr){
  const a = jahr % 19;
  const b = Math.floor(jahr/100), c = jahr % 100;
  const d = Math.floor(b/4), e = b % 4;
  const f = Math.floor((b+8)/25);
  const g = Math.floor((b-f+1)/3);
  const h = (19*a+b-d-g+15) % 30;
  const i = Math.floor(c/4), k = c % 4;
  const l = (32+2*e+2*i-h-k) % 7;
  const m = Math.floor((a+11*h+22*l)/451);
  const monat = Math.floor((h+l-7*m+114)/31);
  const tag = ((h+l-7*m+114) % 31) + 1;
  return new Date(jahr, monat-1, tag); // Monat 0-indiziert in JS
}
function addTage(datum, n){
  const d = new Date(datum);
  d.setDate(d.getDate()+n);
  return d;
}
function toDateKey(d){
  return dateKey(d.getFullYear(), d.getMonth()+1, d.getDate());
}

const feiertagsCache = {};
function feiertageFuerJahr(jahr){
  if (feiertagsCache[jahr]) return feiertagsCache[jahr];
  const ostern = ostersonntag(jahr);
  const map = {};
  map[dateKey(jahr,1,1)] = 'Neujahr';
  map[toDateKey(addTage(ostern,-2))] = 'Karfreitag';
  map[toDateKey(addTage(ostern,1))]  = 'Ostermontag';
  map[dateKey(jahr,5,1)] = 'Tag der Arbeit';
  map[toDateKey(addTage(ostern,39))] = 'Christi Himmelfahrt';
  map[toDateKey(addTage(ostern,50))] = 'Pfingstmontag';
  map[toDateKey(addTage(ostern,60))] = 'Fronleichnam';
  map[dateKey(jahr,10,3)] = 'Tag der Deutschen Einheit';
  map[dateKey(jahr,11,1)] = 'Allerheiligen';
  map[dateKey(jahr,12,25)] = '1. Weihnachtsfeiertag';
  map[dateKey(jahr,12,26)] = '2. Weihnachtsfeiertag';
  feiertagsCache[jahr] = map;
  return map;
}
function feiertagName(y,m,d){
  return feiertageFuerJahr(y)[dateKey(y,m,d)] || null;
}
function defaultTyp(y,m,d){
  if (feiertagName(y,m,d)) return 'F';
  const wd = new Date(y, m-1, d).getDay();
  return (wd===0 || wd===6) ? 'W' : 'A';
}
function emptyEntry(y,m,d){
  return {
    typ: defaultTyp(y,m,d), typManuell:false, ho:true,
    start:'', ende:'', pause:'',
    beschreibung:'', km:'', transport:'', hotel:'', bewirtung:'', sonstiges:'',
    reiseland:'Deutschland', reiseart:'', fr:false, mi:false, ab:false,
    receiptIds: []
  };
}

// ---------- Appwrite-Konfiguration (Cloud-Sync für Geräte-übergreifende Nutzung) ----------
const APPWRITE_CONFIG = {
  endpoint: 'https://fra.cloud.appwrite.io/v1',
  projectId: '6a92d8e0002e9b585e39',
  databaseId: '6a92dad20003b47b4a19',
  tableId: 'key-value',
  bucketId: '6a92dd0f003962ea7128',
};

function loadScript(src){
  return new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = src; s.onload = resolve; s.onerror = reject;
    document.head.appendChild(s);
  });
}
function blobToDataURL(blob){
  return new Promise((resolve, reject)=>{
    const r = new FileReader();
    r.onload = ()=> resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(blob);
  });
}
// Appwrite-IDs: nur a-z, A-Z, 0-9, "_" erlaubt (keine ":", ".", "-"), max. 36 Zeichen,
// dürfen nicht mit "_" beginnen -> Key entsprechend sanitisieren.
function toAppwriteId(key){
  let id = key.replace(/[^a-zA-Z0-9_]/g, '_'); // alles Ungültige (":", "-", ".") -> "_"
  id = id.replace(/^_+/, '');                   // führende "_" entfernen (nicht erlaubt)
  if (!id) id = 'id' + Date.now();
  if (id.length > 36) id = id.slice(0, 36);
  return id;
}

// ---------- Storage-Weiche: Claude-Artefakt (window.storage) ODER Appwrite (Cloud-Sync) ODER IndexedDB (Fallback) ----------
async function createStore(){
  // Fall 1: läuft als Claude-Artefakt -> nutzt die vorhandene Artefakt-Persistenz
  if (typeof window.storage !== 'undefined' && window.storage) {
    storageMode = 'Claude-Artefakt (window.storage)';
    logDebug('Speicher-Modus: ' + storageMode);
    return {
      async get(key){ return window.storage.get(key); },
      async set(key, value){ return window.storage.set(key, value); },
      async delete(key){ return window.storage.delete(key); },
    };
  }

  // Fall 2: Appwrite Cloud-Sync (funktioniert geräteübergreifend)
  try {
    logDebug('Lade Appwrite-SDK von cdn.jsdelivr.net…');
    await loadScript('https://cdn.jsdelivr.net/npm/appwrite@latest');
    logDebug('Appwrite-SDK geladen. Verbinde mit ' + APPWRITE_CONFIG.endpoint + ' (Projekt ' + APPWRITE_CONFIG.projectId + ')');
    const client = new Appwrite.Client()
      .setEndpoint(APPWRITE_CONFIG.endpoint)
      .setProject(APPWRITE_CONFIG.projectId);
    const tablesDB = new Appwrite.TablesDB(client);
    const storage = new Appwrite.Storage(client);

    // Verbindungstest: eine harmlose Leseanfrage, um Endpoint/Project/Table/Permissions sofort zu prüfen
    try {
      await tablesDB.getRow({ databaseId: APPWRITE_CONFIG.databaseId, tableId: APPWRITE_CONFIG.tableId, rowId: 'connection_test' });
      logDebug('Verbindungstest OK (Zeile nicht gefunden ist normal, Zugriff funktioniert).');
    } catch(testErr){
      if (testErr && (testErr.code === 404 || /not.*found/i.test(testErr.message||''))) {
        logDebug('Verbindungstest OK: Datenbank/Tabelle erreichbar (404 = Testzeile existiert nicht, das ist normal).');
      } else {
        logDebug('⚠ Verbindungstest FEHLGESCHLAGEN: ' + (testErr && testErr.message ? testErr.message : testErr) +
          (testErr && testErr.code ? ' (Code ' + testErr.code + ')' : ''));
        throw testErr; // -> fällt in den äußeren catch, damit IndexedDB-Fallback greift statt einer App, die "leer" wirkt
      }
    }

    storageMode = 'Appwrite Cloud-Sync (aktiv)';
    logDebug('Speicher-Modus: ' + storageMode);

    return {
      async get(key){
        const rowId = toAppwriteId(key);
        if (key.indexOf('receipt:') === 0){
          let row;
          try {
            row = await tablesDB.getRow({ databaseId: APPWRITE_CONFIG.databaseId, tableId: APPWRITE_CONFIG.tableId, rowId });
          } catch(e){ logDebug('get(' + key + ') – Zeile nicht gefunden: ' + (e.message||e)); return null; }
          const metaObj = JSON.parse(row.value);
          try {
            const url = storage.getFileDownload({ bucketId: APPWRITE_CONFIG.bucketId, fileId: rowId });
            const resp = await fetch(url);
            const blob = await resp.blob();
            metaObj.dataUrl = await blobToDataURL(blob);
          } catch(e){ logDebug('get(' + key + ') – Beleg-Datei-Download fehlgeschlagen: ' + (e.message||e)); metaObj.dataUrl = null; }
          return { key, value: JSON.stringify(metaObj) };
        }
        try {
          const row = await tablesDB.getRow({ databaseId: APPWRITE_CONFIG.databaseId, tableId: APPWRITE_CONFIG.tableId, rowId });
          return { key, value: row.value };
        } catch(e){ logDebug('get(' + key + ') fehlgeschlagen: ' + (e.message||e)); return null; }
      },
      async set(key, value){
        const rowId = toAppwriteId(key);
        if (key.indexOf('receipt:') === 0){
          const obj = JSON.parse(value);
          const dataUrl = obj.dataUrl;
          const metaObj = Object.assign({}, obj);
          delete metaObj.dataUrl;
          if (dataUrl){
            const resp = await fetch(dataUrl);
            const blob = await resp.blob();
            const file = new File([blob], (obj.name||'beleg')+'.pdf', { type: 'application/pdf' });
            try { await storage.deleteFile({ bucketId: APPWRITE_CONFIG.bucketId, fileId: rowId }); } catch(e){}
            try {
              await storage.createFile({ bucketId: APPWRITE_CONFIG.bucketId, fileId: rowId, file });
            } catch(e){ logDebug('⚠ Beleg-Upload fehlgeschlagen (' + key + '): ' + (e.message||e)); }
          }
          value = JSON.stringify(metaObj);
        }
        try {
          await tablesDB.updateRow({ databaseId: APPWRITE_CONFIG.databaseId, tableId: APPWRITE_CONFIG.tableId, rowId, data: { value } });
        } catch(e){
          try {
            await tablesDB.createRow({ databaseId: APPWRITE_CONFIG.databaseId, tableId: APPWRITE_CONFIG.tableId, rowId, data: { value } });
          } catch(e2){ logDebug('⚠ set(' + key + ') fehlgeschlagen – weder update noch create möglich: ' + (e2.message||e2)); }
        }
        return { key, value };
      },
      async delete(key){
        const rowId = toAppwriteId(key);
        if (key.indexOf('receipt:') === 0){
          try { await storage.deleteFile({ bucketId: APPWRITE_CONFIG.bucketId, fileId: rowId }); } catch(e){}
        }
        try { await tablesDB.deleteRow({ databaseId: APPWRITE_CONFIG.databaseId, tableId: APPWRITE_CONFIG.tableId, rowId }); } catch(e){ logDebug('delete(' + key + ') fehlgeschlagen: ' + (e.message||e)); }
        return { key, deleted: true };
      },
    };
  } catch(err){
    logDebug('⚠ Appwrite-Sync nicht verfügbar, nutze lokalen Speicher (kein Geräte-Sync). Grund: ' + (err && err.message ? err.message : err));
  }

  // Fall 3: IndexedDB-Fallback (rein lokal, nur auf diesem Gerät)
  storageMode = 'Lokal (IndexedDB) – KEIN Geräte-Sync!';
  logDebug('Speicher-Modus: ' + storageMode);
  const dbReady = new Promise((resolve, reject)=>{
    const req = indexedDB.open('zeiterfassung-db', 1);
    req.onupgradeneeded = ()=> { req.result.createObjectStore('kv'); };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
  return {
    async get(key){
      const db = await dbReady;
      return new Promise((resolve, reject)=>{
        const tx = db.transaction('kv', 'readonly');
        const req = tx.objectStore('kv').get(key);
        req.onsuccess = ()=> resolve(req.result !== undefined ? { key, value: req.result } : null);
        req.onerror = ()=> reject(req.error);
      });
    },
    async set(key, value){
      const db = await dbReady;
      return new Promise((resolve, reject)=>{
        const tx = db.transaction('kv', 'readwrite');
        tx.objectStore('kv').put(value, key);
        tx.oncomplete = ()=> resolve({ key, value });
        tx.onerror = ()=> reject(tx.error);
      });
    },
    async delete(key){
      const db = await dbReady;
      return new Promise((resolve, reject)=>{
        const tx = db.transaction('kv', 'readwrite');
        tx.objectStore('kv').delete(key);
        tx.oncomplete = ()=> resolve({ key, deleted: true });
        tx.onerror = ()=> reject(tx.error);
      });
    },
  };
}

function showToast(msg){

  t.classList.add('show');
  clearTimeout(showToast._h);
  showToast._h = setTimeout(()=> t.classList.remove('show'), 1800);

// ---------- App State ----------
const today = new Date();
let state = {
  year: today.getFullYear(),
  month: today.getMonth()+1,
  entries: {},       // key -> entry
  view: 'month',      // month | detail | export
  openDay: null,
  exportData: null,
};

const app = document.getElementById('app');

async function loadMonth(){
  const n = daysInMonth(state.year, state.month);
  const keys = [];
  for (let d=1; d<=n; d++) keys.push(dateKey(state.year, state.month, d));
  const results = await Promise.all(keys.map(loadEntry));
  state.entries = {};
  keys.forEach((k,i)=> { if (results[i]) state.entries[k] = results[i]; });
  render();
}

function changeMonth(delta){
  let m = state.month + delta;
  let y = state.year;
  if (m>12){ m=1; y++; } if (m<1){ m=12; y--; }
  state.month = m; state.year = y;
  loadMonth();
}

// ---------- Rendering ----------
function render(){
  app.innerHTML = '';
  if (state.view === 'export') { renderExport(); return; }
  renderMonth();
  if (state.view === 'detail' && state.openDay) renderDetailSheet(state.openDay);
}

function renderMonth(){
  const monthNames = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
  const n = daysInMonth(state.year, state.month);

  let nonHoCount=0, kmSum=0, kostenSum=0;
  for (let d=1; d<=n; d++){
    const e = state.entries[dateKey(state.year,state.month,d)];
    if (e && e.typ==='A' && !e.ho){
      nonHoCount++;
      kmSum += Number(e.km)||0;
      kostenSum += (Number(e.transport)||0)+(Number(e.hotel)||0)+(Number(e.bewirtung)||0)+(Number(e.sonstiges)||0);
    }
  }

  const header = document.createElement('header');
  header.className = 'top';
  const syncBadge = storageMode.indexOf('Appwrite') === 0 || storageMode.indexOf('Appwrite') > -1
    ? '<span class="flag ho" style="margin-left:6px;">☁ Sync aktiv</span>'
    : (storageMode.indexOf('Claude-Artefakt') > -1
        ? '<span class="flag ho" style="margin-left:6px;">Claude-Speicher</span>'
        : '<span class="flag warn" style="margin-left:6px;">⚠ kein Sync</span>');
  header.innerHTML = `
    <div class="brand">
      <h1>Zeiterfassung</h1>
      <span class="tag">Ledger</span>${syncBadge}
    </div>
    <div class="month-nav">
      <button id="prevM">‹</button>
      <div class="label">${monthNames[state.month-1]} ${state.year}<span class="sub">${n} Tage</span></div>
      <button id="nextM">›</button>
    </div>
    <div class="summary-strip">
      <div class="pill"><div class="n mono">${nonHoCount}</div><div class="l">Vor Ort</div></div>
      <div class="pill"><div class="n mono">${kmSum}</div><div class="l">km</div></div>
      <div class="pill"><div class="n mono">${fmtEUR(kostenSum)}</div><div class="l">€ Kosten</div></div>
    </div>
  `;
  app.appendChild(header);

  const main = document.createElement('main');
  for (let d=1; d<=n; d++){
    const key = dateKey(state.year, state.month, d);
    const e = state.entries[key];
    const dow = WOCHENTAGE[new Date(state.year, state.month-1, d).getDay()];
    const typ = e ? e.typ : defaultTyp(state.year, state.month, d);

    const row = document.createElement('div');
    row.className = 'day-row' + (typ === 'W' ? ' weekend' : '');
    row.dataset.key = key;

    const flags = [];
    if (e && e.ho) flags.push('<span class="flag ho">Homeoffice</span>');
    const istVorOrtTag = e && !e.ho && e.typ==='A' && (e.transport||e.hotel||e.bewirtung||e.km||e.reiseart);
    if (istVorOrtTag) flags.push('<span class="flag trip">Vor Ort</span>');
    if (istVorOrtTag && !e.reiseart) flags.push('<span class="flag warn">⚠ Reiseart fehlt</span>');
    if (e && e.receiptIds && e.receiptIds.length) flags.push(`<span class="flag receipt">${e.receiptIds.length} Beleg${e.receiptIds.length>1?'e':''}</span>`);

    const feiertag = feiertagName(state.year, state.month, d);
    const desc = e && e.beschreibung ? e.beschreibung : (feiertag ? feiertag : (e ? '' : ''));
    const sum = e ? (Number(e.transport)||0)+(Number(e.hotel)||0)+(Number(e.bewirtung)||0)+(Number(e.sonstiges)||0) : 0;

    row.innerHTML = `
      <div class="tab ${typ}"></div>
      <div class="day-body">
        <div class="day-date"><div class="dow">${dow}</div><div class="num">${pad(d)}</div></div>
        <div class="day-mid">
          <div class="desc ${desc?'':'empty'}">${desc || TYP_LABEL[typ]}</div>
          <div class="day-flags">${flags.join('')}</div>
        </div>
        <div class="day-right">
          ${sum>0 ? `<div class="sum">${fmtEUR(sum)}&nbsp;€</div>` : ''}
        </div>
      </div>
    `;
    row.addEventListener('click', ()=> openDetail(key));
    main.appendChild(row);
  }
  app.appendChild(main);

  const fab = document.createElement('div');
  fab.className = 'fab';
  fab.innerHTML = `
    <button id="importBtn" class="secondary">⇪ Importieren</button>
    <button id="exportBtn">Monat exportieren →</button>
    <input type="file" id="importFileInput" accept="application/json" style="display:none">
  `;
  app.appendChild(fab);

  document.getElementById('prevM').onclick = ()=> changeMonth(-1);
  document.getElementById('nextM').onclick = ()=> changeMonth(1);
  document.getElementById('exportBtn').onclick = openExport;
  document.getElementById('importBtn').onclick = ()=> document.getElementById('importFileInput').click();
  document.getElementById('importFileInput').addEventListener('change', async (ev)=>{
    const file = ev.target.files[0];
    if (!file) return;
    showToast('Importiere…');
    await handleImportFile(file);
    ev.target.value = '';
  });
}

// ---------- Import (historische Daten / Export-Datei einlesen) ----------
async function handleImportFile(file){
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    const list = Array.isArray(data) ? data : data.entries;
    if (!Array.isArray(list)) throw new Error('Ungültiges Format: kein "entries"-Array gefunden.');
    let count = 0;
    for (const raw of list){
      const key = raw.date;
      if (!key) continue;
      const entry = {
        typ: raw.typ || 'A',
        typManuell: true,
        ho: !!raw.ho,
        start: raw.start || '', ende: raw.ende || '', pause: raw.pause || '',
        beschreibung: raw.beschreibung || '',
        km: raw.km ?? '', transport: raw.transport ?? '', hotel: raw.hotel ?? '',
        bewirtung: raw.bewirtung ?? '', sonstiges: raw.sonstiges ?? '',
        reiseland: raw.reiseland || 'Deutschland', reiseart: raw.reiseart || '',
        fr: !!raw.fr, mi: !!raw.mi, ab: !!raw.ab,
        receiptIds: [],
      };
      await saveEntry(key, entry);
      count++;
    }
    logDebug('Import abgeschlossen: ' + count + ' Einträge geschrieben.');
    showToast(count + ' Einträge importiert');
    await loadMonth();
  } catch(err){
    logDebug('⚠ Import fehlgeschlagen: ' + (err.message||err));
    showToast('Import fehlgeschlagen – siehe Diagnose 🛈');
  }
}

function openDetail(key){
  state.view = 'detail';
  state.openDay = key;
  render();
}
function closeDetail(){
  state.view = 'month';
  state.openDay = null;
  render();
}

  // receipts: upload pdf
  const pdfInput = sheet.querySelector('#pdfInput');
  sheet.querySelector('#uploadPdfBtn').addEventListener('click', ()=> pdfInput.click());
  pdfInput.addEventListener('change', async (ev)=>{
    const file = ev.target.files[0];
    if (!file) return;
    if (file.size > 4.5*1024*1024){ showToast('PDF zu groß (max ~4,5 MB)'); return; }
    const dataUrl = await fileToDataURL(file);
    const rid = 'r'+Date.now()+Math.random().toString(36).slice(2,7);
    await saveReceipt(rid, { id:rid, name:file.name, mime:'application/pdf', dataUrl, createdAt: Date.now(), date:key });
    syncFormIntoLocalE();
    localE.receiptIds = [...(localE.receiptIds||[]), rid];
    await saveEntry(key, localE);
    state.entries[key] = localE;
    showToast('Beleg gespeichert');
    openDetail(key);
  });

  // receipts: photo -> pdf
  const photoInput = sheet.querySelector('#photoInput');
  sheet.querySelector('#takePhotoBtn').addEventListener('click', ()=> photoInput.click());
  photoInput.addEventListener('change', async (ev)=>{
    const file = ev.target.files[0];
    if (!file) return;
    showToast('Wird verarbeitet…');
    try {
      const pdfDataUrl = await photoToPdf(file);
      const rid = 'r'+Date.now()+Math.random().toString(36).slice(2,7);
      const name = 'Foto-' + new Date().toISOString().slice(0,10) + '.pdf';
      await saveReceipt(rid, { id:rid, name, mime:'application/pdf', dataUrl: pdfDataUrl, createdAt: Date.now(), date:key });
      syncFormIntoLocalE();
      localE.receiptIds = [...(localE.receiptIds||[]), rid];
      await saveEntry(key, localE);
      state.entries[key] = localE;
      showToast('Beleg gespeichert');
      openDetail(key);
    } catch(err){
      showToast('Fehler bei PDF-Erstellung');
    }
  });
}

function fileToDataURL(file){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=> resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

async function photoToPdf(file){
  const dataUrl = await fileToDataURL(file);
  const img = new Image();
  await new Promise((res,rej)=>{ img.onload=res; img.onerror=rej; img.src=dataUrl; });

  // Downscale for reasonable file size (max width 1400px)
  const maxW = 1400;
  const scale = Math.min(1, maxW/img.width);
  const canvas = document.createElement('canvas');
  canvas.width = img.width*scale;
  canvas.height = img.height*scale;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
  const jpeg = canvas.toDataURL('image/jpeg', 0.72);

  const isLandscape = canvas.width > canvas.height;
  const pdf = new jsPDF({ orientation: isLandscape?'landscape':'portrait', unit:'pt', format:'a4' });
  const pageW = pdf.internal.pageSize.getWidth();
  const pageH = pdf.internal.pageSize.getHeight();
  const ratio = Math.min(pageW/canvas.width, pageH/canvas.height);
  const w = canvas.width*ratio, h = canvas.height*ratio;
  const x = (pageW-w)/2, y = (pageH-h)/2;
  pdf.addImage(jpeg, 'JPEG', x, y, w, h);
  return pdf.output('datauristring');
}

// ---------- Export ----------
async function openExport(){
  const n = daysInMonth(state.year, state.month);
  const rows = [];
  let allReceipts = [];
  for (let d=1; d<=n; d++){
    const key = dateKey(state.year, state.month, d);
    const e = state.entries[key];
    if (e && e.typ==='A' && !e.ho){
      const receipts = [];
      for (const rid of (e.receiptIds||[])){
        const r = await loadReceipt(rid);
        if (r) { receipts.push(r); allReceipts.push(r); }
      }
      rows.push({ date:key, ...e, receipts });
    }
  }
  state.exportData = { year: state.year, month: state.month, rows, receiptCount: allReceipts.length };
  state.view = 'export';
  render();
}

function renderExport(){
  const monthNames = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
  const { rows, receiptCount } = state.exportData;
  const wrap = document.createElement('div');
  wrap.className = 'export-view';

  const totalSum = rows.reduce((s,r)=> s + (Number(r.transport)||0)+(Number(r.hotel)||0)+(Number(r.bewirtung)||0)+(Number(r.sonstiges)||0), 0);

  wrap.innerHTML = `
    <button class="back-link" id="backBtn">← Zurück</button>
    <h2>Export ${monthNames[state.month-1]} ${state.year}</h2>
    <div class="sheet-sub">${rows.length} Tage vor Ort · ${receiptCount} Beleg${receiptCount!==1?'e':''} · ${fmtEUR(totalSum)} € Kosten gesamt</div>
    <table class="export-table">
      <thead><tr><th>Datum</th><th>Beschreibung</th><th>km</th><th>€</th><th>Beleg</th></tr></thead>
      <tbody>
        ${rows.map(r=>`
          <tr>
            <td>${r.date.slice(8,10)}.${r.date.slice(5,7)}.</td>
            <td style="font-family:inherit; max-width:140px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${r.beschreibung||'–'}</td>
            <td>${r.km||'–'}</td>
            <td>${fmtEUR((Number(r.transport)||0)+(Number(r.hotel)||0)+(Number(r.bewirtung)||0)+(Number(r.sonstiges)||0))}</td>
            <td>${r.receipts.length||'–'}</td>
          </tr>
        `).join('') || '<tr><td colspan="5" style="font-family:inherit; color:var(--grey);">Keine Vor-Ort-Tage in diesem Monat.</td></tr>'}
      </tbody>
    </table>
    ${rows.length ? `
    <div class="export-note">
      Der Export enthält alle Zeiterfassungs-Daten und Belege dieses Monats als eine Datei.
      Lade diese Datei im Claude-Chat hoch, damit deine Spesenabrechnung.xlsx automatisch befüllt wird.
    </div>
    <button class="export-download" id="downloadBtn">Exportdatei herunterladen (.json)</button>
    ` : ''}
  `;
  app.appendChild(wrap);
  document.getElementById('backBtn').addEventListener('click', ()=> { state.view='month'; render(); });
  const dl = document.getElementById('downloadBtn');
  if (dl) dl.addEventListener('click', downloadExport);
}

function downloadExport(){
  const { year, month, rows } = state.exportData;
  const payload = {
    format: 'zeiterfassung-export-v1',
    year, month,
    generatedAt: new Date().toISOString(),
    entries: rows
  };
  const blob = new Blob([JSON.stringify(payload)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${year}-${pad(month)}_Zeiterfassung-Export.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=> URL.revokeObjectURL(url), 3000);
  showToast('Export heruntergeladen');
}

// ---------- Init ----------
(async function initApp(){
  Store = await createStore();
  loadMonth();
})();

// Service Worker nur registrieren, wenn Datei über http(s) läuft (nicht im Claude-Artefakt-Frame)
// Auto-Update: sobald eine neue service-worker.js-Version erkannt wird, übernimmt sie sofort
// die Kontrolle (skipWaiting + clients.claim im SW) und die Seite lädt sich automatisch neu –
// kein manuelles Cache-Leeren während der aktiven Entwicklung mehr nötig.
// Prüfung erfolgt einmalig bei jedem Öffnen/Neustart der App (reicht für diesen Anwendungsfall).
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', ()=> {
    navigator.serviceWorker.register('./service-worker.js').then((reg)=>{
      reg.update().catch(()=>{});
    }).catch(()=>{});

    let reloadedAlready = false;
    navigator.serviceWorker.addEventListener('controllerchange', ()=>{
      if (reloadedAlready) return; // Sicherheitsnetz gegen Neuladeschleifen
      reloadedAlready = true;
      showToast('Neue Version geladen …');
      setTimeout(()=> window.location.reload(), 400);
    });
  });
}
